server:
  port: 9001
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUK
              uri: lb://PRODUK
              predicates:
                - Path=api/produk/**
            - id: ORDER
              uri: lb://ORDER
              predicates:
                - Path=api/order/**
            - id: PELANGGAN
              uri: lb://PELANGGAN
              predicates:
                - Path=api/pelanggan/**
            - id: AUTH
              uri: lb://AUTH
              predicates:
                - Path=api/auth/**
            - id: ORDER-READ
              uri: lb://ORDER-READ
              predicates:
                - Path=api/order-read/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost
